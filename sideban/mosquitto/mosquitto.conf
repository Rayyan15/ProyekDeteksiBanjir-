# Konfigurasi Mosquitto untuk SIDEBAN (mode demo / jaringan lokal)
# Jalankan:  mosquitto -c mosquitto.conf -v

# Terima koneksi dari ESP32 di jaringan WiFi yang sama
listener 1883 0.0.0.0

# Demo tanpa password. Untuk lebih aman, ganti ke false lalu pakai password_file.
allow_anonymous true

# Simpan pesan retained (status terakhir, ambang) walau Mosquitto di-restart
persistence true
persistence_file sideban.db
autosave_interval 60
